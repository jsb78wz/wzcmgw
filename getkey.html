<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>获取游戏卡密｜王猪传媒</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system}
body{background:#070714;color:#fff;min-height:100vh;padding:30px 15px;}
.box{
    max-width:600px;
    margin:40px auto;
    background:#121233;
    border-radius:16px;
    padding:30px 20px;
    text-align:center;
}
h1{
    color:#ffe266;
}
.key-show{
    width:100%;
    padding:16px;
    background:#0b0b22;
    border:2px solid #2888ff;
    border-radius:12px;
    font-size:20px;
    letter-spacing:2px;
    margin:20px 0;
    color:#47a3ff;
}
.btn{
    width:100%;
    padding:14px;
    margin:8px 0;
    border:none;
    border-radius:10px;
    font-size:16px;
}
.blue-btn{
    background:linear-gradient(90deg,#0b48ad,#2888ff);
    color:white;
}
.back-btn{
    background:#24244e;
    color:#ddd;
}
.tips{
    color:#aaa;
    margin-top:12px;
    font-size:14px;
    line-height:1.7;
}
</style>
</head>
<body>
<div class="box">
    <h1>丧尸游戏卡密领取</h1>
    <div class="key-show" id="keyBox"></div>
    <button class="btn blue-btn" onclick="genKey()">🔄重新生成卡密</button>
    <button class="btn blue-btn" onclick="copyKey()">📋复制卡密并返回官网验证</button>
    <button class="btn back-btn" onclick="location.href='index.html'">返回官网首页</button>
    <div class="tips">
        卡密由大小写字母+数字随机组合，一共14位<br>
        ⚠️前端演示：刷新页面卡密失效，每次生成新卡密
    </div>
</div>
<script>
let nowKey="";
//随机生成14位密钥
function genKey(){
    const charPool="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
    nowKey="";
    for(let i=0;i<14;i++){
        let ran=Math.floor(Math.random()*charPool.length);
        nowKey+=charPool[ran];
    }
    document.getElementById("keyBox").innerText=nowKey;
}
//复制并且带回首页
async function copyKey(){
    if(!nowKey)return;
    await navigator.clipboard.writeText(nowKey);
    //携带卡密跳转回首页自动填充输入框
    location.href="index.html?k="+nowKey;
}
window.onload=genKey;
</script>
</body>
</html>
